<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>היסטוריה עולמית — נוח הררי</title><style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#efcf79;font:18px Arial;display:grid;place-items:center;min-height:100dvh}main{width:100%;max-width:100vw;display:grid;gap:8px;text-align:center}h1,h2{margin:3px;font-size:clamp(18px,3vw,26px)}#picture{position:relative;aspect-ratio:16/9;max-height:53dvh;width:100%;background:#202b3c;display:grid;place-items:center;border:1px solid #b99b55;border-radius:8px;overflow:hidden}img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}#sub{color:white;min-height:2.6em;font-size:clamp(20px,calc(2.5vw + 5px),26px)}audio{width:100%;direction:ltr}button,select{background:#273345;color:#efcf79;border:1px solid #b99b55;border-radius:6px;padding:8px;font:inherit}select{width:100%}small{color:#aaa}

body.windows main{width:min(100vw,1200px);max-width:1200px}#nav{display:flex;justify-content:center;gap:8px}#nav button{flex:1;max-width:240px;min-width:0;padding-inline:4px;white-space:nowrap}#menu[hidden],#pic[hidden]{display:none}#menu{height:auto;max-height:45dvh}html:fullscreen{background:#211308}main{padding:4px;min-width:0}#picture{max-height:53dvh}#title{position:absolute;bottom:0;left:0;right:0;z-index:2;margin:0;padding:6px 8px;background:rgba(0,0,0,.65);pointer-events:none}#subtitles{font-size:clamp(20px,calc(2.5vw + 5px),26px);font-weight:700;line-height:1.4;color:#fff2d4}#sub{min-height:1.4em}#subNext{opacity:.5;min-height:1.4em}#topicPanel[hidden]{display:none}#topicPanel{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at top,#543213,#160d07);display:flex;flex-direction:column;overflow:hidden;padding:8px}#topicPanel header{display:flex;align-items:center;justify-content:center;gap:16px;flex:none;padding:8px}#topicPanel #menu{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;min-height:0;max-height:none;width:100%;max-width:none}body.windows #topicPanel #menu{width:min(100%,1200px);margin-inline:auto}#menu button{text-align:right;flex:none;width:100%}#menu button.active{outline:2px solid #fff2d4}body.menu-open{overflow:hidden}#lessons[hidden]{display:none!important}#lectureCounter{color:var(--gold);font-weight:900;direction:ltr;display:inline-block;margin-inline-start:4px;white-space:nowrap}#lecturePanel[hidden]{display:none}#lecturePanel{position:fixed;inset:0;z-index:101;background:radial-gradient(ellipse at top,#543213,#160d07);display:flex;flex-direction:column;padding:8px;overflow:hidden}#lecturePanel header{display:flex;justify-content:center;align-items:center;gap:16px;padding:8px}#lectureList{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:0;width:100%;margin:auto}body.windows #lectureList{max-width:1200px}#lectureList button{text-align:right;flex:none}#lectureList button.active{outline:2px solid #fff2d4}body{align-items:start}main{align-content:start;grid-template-columns:minmax(0,1fr)}#picture{aspect-ratio:auto;height:min(calc((100vw - 8px)*0.5625 + 50px),calc(53dvh + 50px));max-height:none}body.windows #picture{height:min(calc((min(100vw,1200px) - 8px)*0.5625 + 50px),calc(53dvh + 50px))}#subtitles{height:8.4em;display:grid;grid-template-rows:1fr 1fr;overflow:hidden;border:1px solid #b78740;border-radius:8px;background:#211308;padding:4px 8px}#sub,#subNext{min-height:0;overflow:auto;align-content:center;overflow-wrap:anywhere}#sub{font-size:inherit}#subNext{opacity:.5}#quickTopics{display:flex;gap:5px;justify-content:center}#quickTopics[hidden]{display:none}#quickTopics button{flex:1;min-width:0;padding:5px 3px;font-size:clamp(12px,2.5vw,16px)}#quickTopics span{display:block;direction:ltr;font-size:.9em}</style><main><h1 id="lessonTitle">היסטוריה עולמית — נוח הררי <span id="lectureCounter">1 / 28</span></h1><select id="lessons" aria-label="בחירת הרצאה" hidden></select><div id="nav"><button id="next">הבא</button><button id="topics" aria-expanded="false" aria-controls="topicPanel">🦉 תפריט</button><button id="prev">הקודם</button><button id="lectureButton" aria-expanded="false">הרצאות</button></div><section id="lecturePanel" hidden role="dialog" aria-modal="true" aria-label="הרצאות"><header><button id="closeLectures">✕ סגירה</button><h2>הרצאות</h2></header><div id="lectureList"></div></section><section id="topicPanel" hidden role="dialog" aria-modal="true" aria-label="תפריט נושאים"><header><button id="closeTopics">✕ סגירה</button><h2>תפריט נושאים</h2></header><div id="menu" role="list"></div></section><div id="picture"><span id="placeholder"></span><img id="pic" hidden><h2 id="title"></h2></div><div id="subtitles"><div id="sub"></div><div id="subNext"></div></div><audio id="audio" controls preload="metadata"></audio><div id="quickTopics" hidden></div><small id="status"></small></main><script src="lectures.js"></script><script>let scenes=[],cues=[],base="";const $=id=>document.getElementById(id),a=$('audio');let current=-1;function render(){if(!scenes.length)return;let t=a.currentTime,i=scenes.findLastIndex(s=>s.start<=t);i=Math.max(0,i);if(i!==current){current=i;let s=scenes[i];$('title').textContent=s.title;$('placeholder').textContent=s.title+' — תמונה בהכנה';$('pic').hidden=true;$('pic').dataset.fallback=base+s.image;$('pic').src=s.id==='harari-opening'?base+s.image:base+'images/'+encodeURIComponent(s.id+' - '+s.title+'.webp');$('menu').querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));}let ci=cues.findIndex(c=>c[0]<=t&&c[1]>t);$('sub').textContent=ci>=0?cues[ci][2]:'';let ni=ci>=0?ci+1:cues.findIndex(c=>c[0]>t);$('subNext').textContent=ni>=0&&ni<cues.length?cues[ni][2]:'';} $('pic').onload=()=>$('pic').hidden=false;$('pic').onerror=()=>{const p=$('pic');if(p.dataset.fallback){const fallback=p.dataset.fallback;p.dataset.fallback='';p.src=fallback;}else p.hidden=true;};function go(i){if(!scenes.length)return;a.currentTime=scenes[Math.max(0,Math.min(scenes.length-1,i))].start;render()}function enterFull(){if(document.fullscreenElement||document.webkitFullscreenElement)return;const el=document.documentElement;try{const fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn){const p=fn.call(el);if(p&&p.catch)p.catch(()=>{});}}catch(e){}}if(/Windows/i.test(navigator.userAgent))document.body.classList.add('windows');function showMenu(open){$('topicPanel').hidden=!open;document.body.classList.toggle('menu-open',open);if(open){$('menu').querySelector('.active')?.scrollIntoView({block:'nearest'});}$('topics').setAttribute('aria-expanded',String(open));}document.addEventListener('click',e=>{if(e.target.closest('button,select,audio'))enterFull();},true);$('menu').onclick=e=>{const b=e.target.closest('button[data-index]');if(b){go(+b.dataset.index);showMenu(false)}};$('topics').onclick=()=>showMenu($('topicPanel').hidden);$('closeTopics').onclick=()=>showMenu(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')showMenu(false)});$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);a.ontimeupdate=render;a.onseeked=render;
function loadScript(src){return new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=src;el.onload=()=>{el.remove();resolve()};el.onerror=()=>{el.remove();reject(new Error(src))};document.head.append(el)})}
async function loadLesson(i){const l=window.lectures[i];showMenu(false);$('quickTopics').hidden=true;$('quickTopics').replaceChildren();$('lessons').disabled=true;a.pause();scenes=[];cues=[];current=-1;$('menu').replaceChildren();$('pic').hidden=true;$('sub').textContent='';$('subNext').textContent='';$('title').textContent='';$('placeholder').textContent='';$('lectureCounter').textContent=(i+1)+' / 28';$('lessons').value=i;$('lectureList').querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));base=l.folder;$('status').textContent='טוען הרצאה…';try{window.lessonScenes=null;window.lessonCues=null;await loadScript(base+'scenes.js');await loadScript(base+'subtitles.js');scenes=window.lessonScenes;cues=window.lessonCues;if(i===0&&Array.isArray(scenes)&&scenes.length&&scenes[0].start===0){scenes=[{id:'harari-opening',start:0,title:'יובל נח הררי וספריו',image:'images/harari-opening.webp'}, {...scenes[0],start:3},...scenes.slice(1)];}if(!Array.isArray(scenes)||!scenes.length||!Array.isArray(cues))throw Error('invalid data');a.src=base+'lesson.opus';a.load();scenes.forEach((s,i)=>{const b=document.createElement('button');b.dataset.index=i;b.textContent=String(Math.floor(s.start/60)).padStart(2,'0')+':'+String(Math.floor(s.start%60)).padStart(2,'0')+' — '+s.title;$('menu').append(b)});if(i===0){for(const id of ["lecture-01-01","lecture-01-02","lecture-01-03"]){const j=scenes.findIndex(s=>s.id===id);if(j<0)continue;const s=scenes[j],b=document.createElement('button'),stamp=document.createElement('span');b.textContent=s.title;stamp.textContent=String(Math.floor(s.start/60)).padStart(2,'0')+':'+String(Math.floor(s.start%60)).padStart(2,'0');b.append(stamp);b.onclick=()=>go(j);$('quickTopics').append(b)}$('quickTopics').hidden=false;}$('status').textContent='';render()}catch(e){$('status').textContent='שגיאה בטעינת קובצי ההרצאה: '+e.message}finally{$('lessons').disabled=false}}
function showLectures(open){$('lecturePanel').hidden=!open;$('lectureButton').setAttribute('aria-expanded',String(open));document.body.classList.toggle('menu-open',open||!$('topicPanel').hidden);} $('lectureButton').onclick=()=>{showMenu(false);showLectures(true)};$('closeLectures').onclick=()=>showLectures(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')showLectures(false)});window.lectures.slice(0,28).forEach((l,i)=>{const label=i===0?'שיעור 1- מהמפץ ועד הומו ספיינס':l.title;$('lessons').add(new Option(label,i));const b=document.createElement('button');b.textContent=label;b.onclick=()=>{showLectures(false);loadLesson(i)};$('lectureList').append(b)});$('lessons').onchange=()=>loadLesson(+$('lessons').value);loadLesson(0);</script></html>
